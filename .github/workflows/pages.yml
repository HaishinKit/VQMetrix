name: Update landing page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'Scripts/build_landing_page.rb'
      - 'Scripts/build_documentation_site.rb'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
concurrency:
  group: landing-page
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check released documentation version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          released_tag=$(gh release view --json tagName --jq .tagName)
          if [ "$released_tag" = "$(cat VERSION)" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'The versioned release workflow will publish the new documentation.'
          fi
      - name: Prepare released documentation and landing page
        if: steps.release.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_tag=$(gh release view --json tagName --jq .tagName)
          gh release download "$release_tag" --pattern api-documentation.tar.gz --dir "$RUNNER_TEMP/reference"
          mkdir -p "$RUNNER_TEMP/site"
          tar -xzf "$RUNNER_TEMP/reference/api-documentation.tar.gz" -C "$RUNNER_TEMP/site"
          /usr/bin/ruby Scripts/build_documentation_site.rb "$RUNNER_TEMP/site" "$release_tag"
      - if: steps.release.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
  deploy:
    if: needs.build.outputs.ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
